# Builds a release of the compiler on each platform whenever a version tag
# (v1.0, v1.2.3, v2.0-rc1, ...) is pushed, and publishes the archives as a
# GitHub release of that tag once every platform has built and passed. Run by
# hand (workflow_dispatch), it builds and tests the same archives and leaves
# them as the run's artifacts, without a release.
#
# Each archive is one directory, laid out by scripts/package_release.py: the
# compiler with every blessed package compiled in (K_BUILTIN_LIBS=all),
# the standard library, TinyCC's runtime, the packages' sources and the
# libraries a `k build` links, the docs, the samples and the VS Code
# extension. Before it is archived, the build tree it came from is moved
# away and the samples run with the compiler in it, in-process and through
# `k build`, so it is tested as it will be unpacked.
#
# Beside the archives, the release has SHA256SUMS: the SHA-256 of each, in
# the format `sha256sum -c` reads. It is named without the version, so
# releases/latest/download/SHA256SUMS is the latest release's, and a person
# or a tool that installs releases can check a download without the GitHub
# API and its rate limit.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+*"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older images where there is a choice, since what a release is
          # built with sets what it needs: the static libraries a `klang
          # build` links take an MSVC at least as new as the one that built
          # them, and the Linux compiler runs where glibc is at least as new
          # as the one it was built against (2.35 on Ubuntu 22.04).
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64

    env:
      # Floating-point std::to_chars, which the compiler prints numbers
      # with, is in the macOS C++ library from 13.3 on.
      MACOSX_DEPLOYMENT_TARGET: "13.3"
      # MSBuild's lingering nodes would hold the build tree the test moves.
      MSBUILDDISABLENODEREUSE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # As in ci.yml: what SDL3, built for the gfx package, talks to, and
      # Mesa's lavapipe, a Vulkan device for the gfx samples to run on.
      - name: Install SDL build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev libsndio-dev
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
          libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev libgbm-dev libdbus-1-dev
          libibus-1.0-dev libudev-dev libthai-dev libpipewire-0.3-dev libwayland-dev
          libdecor-0-dev liburing-dev mesa-vulkan-drivers libvulkan1

      - name: Name the release
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="snapshot-${GITHUB_SHA::7}"; fi
          echo "RELEASE_NAME=klang-$version-${{ matrix.platform }}" >> "$GITHUB_ENV"
          echo "K_VERSION=$version" >> "$GITHUB_ENV"

      # The version the compiler reports: the tag, as the shallow checkout
      # may have no tags for git describe to find.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DK_BUILTIN_LIBS=all "-DK_VERSION=${{ env.K_VERSION }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: python scripts/package_release.py --build build --config Release --out dist/${{ env.RELEASE_NAME }}

      # The compiler knows where its build put the standard library, TinyCC's
      # runtime and the packages; with that gone it has to find them beside
      # itself, as an unpacked release does.
      - name: Move the build tree away
        shell: bash
        run: mv build build-moved

      # A compiler that cannot find a package it has compiled in fetches and
      # builds it into K_HOME instead (build/klang-home for the samples
      # runner), which passes the samples but is not a release that works
      # without git and cmake.
      - name: Test the release
        shell: bash
        run: |
          python samples/run_samples.py --exe "dist/$RELEASE_NAME/k${{ runner.os == 'Windows' && '.exe' || '' }}"
          if [ -e build/klang-home/pkg ]; then
            echo "the release fetched packages it has compiled in:"; ls -R build/klang-home/pkg | head -20; exit 1
          fi

      - name: Archive
        shell: bash
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          directory="dist/$RELEASE_NAME"
          if [ "$RUNNER_OS" = Windows ]; then
            python scripts/archive_release.py "$directory" "$directory.zip"
          else
            python scripts/archive_release.py "$directory" "$directory.tar.gz"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_NAME }}
          path: dist/${{ env.RELEASE_NAME }}.*
          if-no-files-found: error

  verify_core:
    name: Reproduce macOS arm64 core
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Find Ninja
        shell: bash
        run: command -v ninja || brew install ninja

      - name: Build and compare independent core releases
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="snapshot-${GITHUB_SHA::7}"; fi
          python scripts/reproduce_core.py --out build/repro-core --version "$version" --jobs 2

      - name: Save reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-reproducibility-macos-arm64
          path: |
            build/repro-core/*.json
            build/repro-core/*/*.json
            build/repro-core/*/*.log
          if-no-files-found: warn

      - name: Save verified core archive
        uses: actions/upload-artifact@v4
        with:
          name: klang-macos-arm64-core
          path: build/repro-core/a/*-macos-arm64-core.tar.gz
          if-no-files-found: error

  verify_cloud:
    name: Reproduce Linux ${{ matrix.arch }} cloud
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang ninja-build

      - name: Download the pinned ONNX Runtime package
        run: |
          mkdir -p build
          curl --fail --silent --show-error --location --retry 4 \
            https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.24.4/microsoft.ml.onnxruntime.1.24.4.nupkg \
            -o build/onnxruntime.nupkg

      - name: Build and compare independent cloud releases
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then version="$GITHUB_REF_NAME"; else version="snapshot-${GITHUB_SHA::7}"; fi
          python scripts/reproduce_core.py --profile cloud --onnx-package build/onnxruntime.nupkg \
            --out build/repro-cloud --version "$version" --jobs 2 --serial

      - name: Save reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-reproducibility-linux-${{ matrix.arch }}
          path: |
            build/repro-cloud/*.json
            build/repro-cloud/*/*.json
            build/repro-cloud/*/*.log
          if-no-files-found: warn

      - name: Save verified cloud archive
        uses: actions/upload-artifact@v4
        with:
          name: klang-linux-${{ matrix.arch }}-cloud
          path: build/repro-cloud/a/*-linux-${{ matrix.arch }}-cloud.tar.gz
          if-no-files-found: error


  release:
    name: Publish
    if: github.ref_type == 'tag'
    needs: [build, verify_core, verify_cloud]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: klang-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip *.tar.gz > SHA256SUMS

      # The action uploads a release's files before it publishes it, which a
      # repository with immutable releases requires, except for a
      # pre-release: that it publishes first. So a pre-release starts as a
      # draft and the next step publishes it, once its files are in.
      - uses: softprops/action-gh-release@v3
        id: release
        with:
          name: K ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
          body: |
            Prebuilt compilers with the blessed packages (gfx, audio, ui, physics) compiled in. Unpack anywhere and put the directory on PATH; see "Install a release" in README.md for what each platform needs besides, and for checking a download against SHA256SUMS.

            The macOS arm64 core archive contains the compiler and runtime with no native packages compiled in. Release verification builds it twice and tests both extracted archives.

            The Linux arm64 and x64 cloud archives include the prebuilt Cordis inference gateway, the CPU provider and ONNX Runtime. The installation guide describes model and lock configuration.

      - name: Publish the pre-release
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq '.html_url'

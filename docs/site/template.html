<!DOCTYPE html>
<html lang="$doclang$" data-page-lang="$pagelang$" data-lang="$pagelang$" data-theme="light" data-accent="neutral" data-layout="<!--KUI_LAYOUT-->">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$pagetitle$ · K</title>
<meta name="k-page-lang" content="$pagelang$">
$if(alt-en)$<meta name="k-alt-en" content="$alt-en$">$endif$
$if(alt-zh)$<meta name="k-alt-zh" content="$alt-zh$">$endif$
<link rel="icon" href="$root$docs/logo/logo_black_fg_white_bg_square.png">
<script>
(function() {
  try {
    var rootEl = document.documentElement;
    window.addEventListener('pointerdown', function() { rootEl.setAttribute('data-pointer-focus', ''); }, { passive: true });
    window.addEventListener('keydown', function(e) {
      if (e.key === 'Tab' || e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        rootEl.removeAttribute('data-pointer-focus');
      }
    }, { passive: true });
    var t = localStorage.getItem('k-docs-theme') || localStorage.getItem('theme');
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    rootEl.setAttribute('data-theme', t);
    var a = localStorage.getItem('k-docs-accent') || localStorage.getItem('kui-accent') || 'neutral';
    rootEl.setAttribute('data-accent', a);
    var pLang = rootEl.getAttribute('data-page-lang') || 'en';
    var hasPair = !!document.querySelector('meta[name="k-alt-zh"]') && !!document.querySelector('meta[name="k-alt-en"]');
    var uiLang = pLang;
    if (pLang === 'zh') {
      localStorage.setItem('k-docs-lang', 'zh');
      uiLang = 'zh';
    } else if (!hasPair) {
      uiLang = localStorage.getItem('k-docs-lang') || 'en';
    }
    rootEl.setAttribute('data-lang', uiLang);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="$root$style.css?v=$stylever$">
$if(highlighting-css)$
<style>
$highlighting-css$
</style>
$endif$
</head>
<body>
<div class="site-shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
        <button type="button" class="mobile-nav-btn" id="k-mobile-nav" aria-label="Toggle navigation" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
        </button>
        <a class="kense-parent-link" href="https://kense-labs.github.io/" data-en-href="https://kense-labs.github.io/en/" data-zh-href="https://kense-labs.github.io/" title="Kense">
          <svg class="kense-parent-mark" width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 3.5A1.5 1.5 0 0 1 5.5 2h2.2A1.5 1.5 0 0 1 9.2 3.5v17A1.5 1.5 0 0 1 7.7 22H5.5A1.5 1.5 0 0 1 4 20.5v-17Zm6.3 8.1L17.6 2h4.1l-7.5 9.6L22 22h-4.3l-7.4-10.4Z"/></svg>
          <span>Kense</span>
        </a>
        <span class="brand-slash" aria-hidden="true">/</span>
        <a class="brand-split" href="$root$index.html" data-en-href="$root$index.html" data-zh-href="$root$README.zh-CN.html">
          <svg class="k-brand-emblem" width="20" height="20" viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <path fill="#FB7185" d="M11 12a3 3 0 0 1 3-3h5a3 3 0 0 1 3 3v40a3 3 0 0 1-3 3h-5a3 3 0 0 1-3-3Z"/>
            <path fill="#FDA4AF" d="M23 29.5 40.5 9H52.5L33.5 31.5H23Z"/>
            <path fill="#E11D48" d="M32.5 29.5 53.5 55H40.5L23 34V29.5Z"/>
            <path fill="#FFF1F2" d="m27.5 27.2 4.8 4.8-4.8 4.8-4.8-4.8Z"/>
          </svg>
          <span class="brand-wordmark" data-en="K Language" data-zh="K 语言">K</span>
          <span class="brand-ver">v0.1.0</span>
        </a>
      </div>

      <!--KUI_TOPNAV-->

      <div class="topbar-actions">
        <button type="button" class="topbar-search-pill" data-search-open aria-label="Search documentation">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
          <span class="topbar-search-lbl" data-en="Search" data-zh="搜索">Search</span>
          <kbd>⌘K</kbd>
        </button>
        <button type="button" class="icon-chip" id="k-theme-toggle" aria-label="Toggle color theme" title="Toggle theme / 切换主题">
          <svg class="theme-icon-moon" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.8A5.7 5.7 0 0 1 6.2 2.5a5.7 5.7 0 1 0 7.3 7.3Z"/></svg>
          <svg class="theme-icon-sun" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="2.8"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8H3M13 8h1.4M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1"/></svg>
        </button>
        <div class="accent-wrap">
          <button type="button" class="icon-chip" id="k-accent-btn" aria-label="Choose accent color" aria-expanded="false" title="Accent color / 强调色">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2a6 6 0 1 0 0 12 1.7 1.7 0 0 0 1.7-1.7c0-.4-.2-.8-.4-1.1-.3-.3-.4-.7-.4-1.1a1.6 1.6 0 0 1 1.6-1.6H12A2 2 0 0 0 14 6.5C14 4 11.3 2 8 2Z"/><circle cx="5.2" cy="7.5" r=".7" fill="currentColor"/><circle cx="7.4" cy="5.2" r=".7" fill="currentColor"/><circle cx="10.4" cy="5.5" r=".7" fill="currentColor"/></svg>
          </button>
          <div class="accent-popover" id="k-accent-popover" role="dialog" aria-label="Accent preset">
            <p class="accent-popover-title" data-en="Accent" data-zh="主题强调色">Accent</p>
            <div class="accent-grid">
              <button type="button" class="accent-swatch" data-accent-val="neutral"><span class="accent-dot" style="background:#171717"></span>Neutral</button>
              <button type="button" class="accent-swatch" data-accent-val="kense"><span class="accent-dot" style="background:#394DF2"></span>Kense</button>
              <button type="button" class="accent-swatch" data-accent-val="blue"><span class="accent-dot" style="background:#245bc4"></span>Blue</button>
              <button type="button" class="accent-swatch" data-accent-val="violet"><span class="accent-dot" style="background:#7142b6"></span>Violet</button>
              <button type="button" class="accent-swatch" data-accent-val="teal"><span class="accent-dot" style="background:#08776d"></span>Teal</button>
              <button type="button" class="accent-swatch" data-accent-val="rose"><span class="accent-dot" style="background:#e11d48"></span>Rose</button>
              <button type="button" class="accent-swatch" data-accent-val="amber"><span class="accent-dot" style="background:#955a08"></span>Amber</button>
            </div>
          </div>
        </div>
        <!--KUI_LANG_DROPDOWN-->
        <a class="cta-chip" href="https://github.com/kense-labs/klang" aria-label="GitHub repository">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          <span class="cta-label">GitHub</span>
        </a>
      </div>
    </div>
  </header>

  <!--KUI_LANDING-->

  <div class="docs-frame">
    <div class="aside-backdrop" id="k-aside-backdrop"></div>
    <aside class="aside" aria-label="Documentation navigation">
      <button type="button" class="search-trigger" id="k-search-open" aria-label="Search documentation">
        <span class="search-trigger-left">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
          <span data-en="Search" data-zh="搜索">Search</span>
        </span>
        <kbd>⌘K</kbd>
      </button>
      <div class="scroll">
        <!--KUI_SIDEBAR-->
      </div>
    </aside>

    <main class="docs-main">
      <div class="docs-pad">
        <article class="doc">
          <!--KUI_HERO-->
          <!--KUI_DOC_HEAD-->
          <!--KUI_SPEC_OPEN-->
          $if(toc)$
          <details class="toc-drawer">
            <summary>
              <span data-en="On this page" data-zh="本页目录">On this page</span>
              <svg class="toc-drawer-chevron" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
            </summary>
            <div class="toc-drawer-body">
              $table-of-contents$
            </div>
          </details>
          $endif$
          <div class="doc-body<!--KUI_BODY_CLASS-->">
            $body$
          </div>
          <!--KUI_SPEC_CLOSE-->
          <!--KUI_PAGER-->
          <!--KUI_FOOTER-->
        </article>
      </div>
    </main>

    $if(toc)$
    <aside class="doc-outline" aria-label="On this page">
      <div class="doc-outline-inner">
        <p class="doc-outline-title" data-en="On this page" data-zh="本页目录">On this page</p>
        <div class="doc-outline-body">
          $table-of-contents$
        </div>
      </div>
    </aside>
    $endif$
  </div>
</div>

<!--KUI_GUIDE_BOT-->

<!-- Command Palette Search Modal -->
<div class="kui-cmdk-backdrop" id="k-cmdk-backdrop" role="dialog" aria-modal="true" aria-label="Search documentation">
  <div class="kui-cmdk">
    <div class="kui-cmdk-head">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input type="text" id="k-cmdk-input" class="kui-cmdk-input" placeholder="Search documentation, spec, benchmarks, samples..." data-en-placeholder="Search documentation, spec, benchmarks, samples..." data-zh-placeholder="搜索 K 文档、架构图解、语言规范、基准与示例..." autocomplete="off">
      <kbd class="kui-cmdk-esc" id="k-cmdk-close">ESC</kbd>
    </div>
    <div class="kui-cmdk-results" id="k-cmdk-results"></div>
    <div class="kui-cmdk-foot">
      <span data-en="↑↓ navigate · Enter open · Esc close" data-zh="↑↓ 选择 · Enter 打开 · Esc 关闭">↑↓ navigate · Enter open · Esc close</span>
      <span id="k-cmdk-count"></span>
    </div>
  </div>
</div>

<!-- Diagram Lightbox Modal -->
<div class="kui-lightbox" id="k-lightbox" role="dialog" aria-modal="true" aria-label="Diagram viewer">
  <div class="kui-lightbox-card">
    <div class="kui-lightbox-head">
      <span class="kui-lightbox-title" id="k-lightbox-title">Kense OS Diagram</span>
      <div style="display:flex;gap:0.4rem;align-items:center;">
        <a class="stage-chip" id="k-lightbox-open" href="#" target="_blank" rel="noopener" data-en="Open SVG" data-zh="打开 SVG">Open SVG</a>
        <button type="button" class="stage-chip" id="k-lightbox-close" data-en="Close" data-zh="关闭">Close</button>
      </div>
    </div>
    <div class="kui-lightbox-body">
      <img id="k-lightbox-img" src="" alt="">
    </div>
  </div>
</div>

<script>var root = '$root$', searchFile = '$searchfile$';</script>
<script src="$root$site.js?v=$sitever$"></script>
<script src="$root$search.js?v=$searchver$"></script>
</body>
</html>

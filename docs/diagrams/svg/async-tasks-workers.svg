<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title description">
  <title id="title">K · Structured async &amp; isolated workers</title>
  <desc id="description">Cooperative lexical task scopes paired with isolated worker threads communicating over typed queues.</desc>
  <rect width="920" height="500" rx="14" fill="#F8F6F0"/>
  <g font-family="Menlo, SFMono-Regular, Consolas, monospace">
    <rect x="36" y="24" width="848" height="42" rx="8" fill="#141413"/>
    <text x="54" y="51" fill="#FDFCF9" font-size="20" text-anchor="start" font-weight="700">STRUCTURED ASYNC &amp; ISOLATED WORKERS</text>
    <text x="36" y="92" fill="#645F56" font-size="14.5" text-anchor="start">Lexical task scopes for cooperative async; isolated OS workers over typed queues.</text>

    <!-- Left Panel: Cooperative Async -->
    <rect x="36" y="114" width="408" height="304" rx="8" fill="#FDFCF9" stroke="#D4CDC0" stroke-width="1.15"/>
    <rect x="36" y="114" width="408" height="38" rx="8" fill="#141413"/>
    <rect x="36" y="140" width="408" height="12" fill="#141413"/>
    <text x="56" y="139" fill="#FDFCF9" font-size="14" text-anchor="start" font-weight="700">COOPERATIVE ASYNC (NATIVE &amp; WASI)</text>

    <rect x="54" y="168" width="372" height="52" rx="6" fill="#F8F6F0" stroke="#D4CDC0" stroke-width="1.1"/>
    <text x="240" y="190" fill="#141413" font-size="13.5" text-anchor="middle" font-weight="700">task scope (parent frame)</text>
    <text x="240" y="209" fill="#645F56" font-size="11.5" text-anchor="middle">awaits children · cancels &amp; drains on exit</text>

    <path d="M240 220V236M145 236H335M145 236V250M335 236V250" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="141,244 145,250 149,244" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="331,244 335,250 339,244" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="54" y="252" width="178" height="68" rx="6" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.25"/>
    <text x="143" y="276" fill="#141413" font-size="13" text-anchor="middle" font-weight="700">async fn A</text>
    <text x="143" y="295" fill="#645F56" font-size="11.5" text-anchor="middle">state machine</text>
    <text x="143" y="311" fill="#394DF2" font-size="11" text-anchor="middle">suspend @ await</text>

    <rect x="248" y="252" width="178" height="68" rx="6" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.25"/>
    <text x="337" y="276" fill="#141413" font-size="13" text-anchor="middle" font-weight="700">async fn B</text>
    <text x="337" y="295" fill="#645F56" font-size="11.5" text-anchor="middle">task frame</text>
    <text x="337" y="311" fill="#394DF2" font-size="11" text-anchor="middle">cancel + cleanup</text>

    <rect x="54" y="336" width="372" height="64" rx="6" fill="#141413"/>
    <text x="240" y="362" fill="#FDFCF9" font-size="13" text-anchor="middle" font-weight="700">Scheduler / Reactor (runtime_tasks.h)</text>
    <text x="240" y="382" fill="#B5B0A6" font-size="11.5" text-anchor="middle">poll · wake · deterministic drain order</text>

    <!-- Center Bridge: Typed Queue -->
    <path d="M444 266H474" fill="none" stroke="#394DF2" stroke-width="1.8" stroke-dasharray="4 3" stroke-linecap="round"/>
    <polyline points="467,262 474,266 467,270" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M474 294H444" fill="none" stroke="#394DF2" stroke-width="1.8" stroke-dasharray="4 3" stroke-linecap="round"/>
    <polyline points="451,290 444,294 451,298" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Panel: Native Worker Threads -->
    <rect x="476" y="114" width="408" height="304" rx="8" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.25"/>
    <rect x="476" y="114" width="408" height="38" rx="8" fill="#394DF2"/>
    <rect x="476" y="140" width="408" height="12" fill="#394DF2"/>
    <text x="496" y="139" fill="#FDFCF9" font-size="14" text-anchor="start" font-weight="700">ISOLATED NATIVE WORKERS (NO SHARED STATE)</text>

    <rect x="494" y="168" width="176" height="114" rx="6" fill="#F8F6F0" stroke="#D4CDC0" stroke-width="1.1"/>
    <text x="582" y="191" fill="#141413" font-size="13.5" text-anchor="middle" font-weight="700">Worker Thread 1</text>
    <text x="582" y="212" fill="#645F56" font-size="11.5" text-anchor="middle">private data stack</text>
    <text x="582" y="230" fill="#645F56" font-size="11.5" text-anchor="middle">private task loop</text>
    <text x="582" y="252" fill="#141413" font-size="11.5" text-anchor="middle">runtime_threads.h</text>
    <text x="582" y="270" fill="#394DF2" font-size="11" text-anchor="middle">zero shared refs</text>

    <rect x="690" y="168" width="176" height="114" rx="6" fill="#F8F6F0" stroke="#D4CDC0" stroke-width="1.1"/>
    <text x="778" y="191" fill="#141413" font-size="13.5" text-anchor="middle" font-weight="700">Worker Thread N</text>
    <text x="778" y="212" fill="#645F56" font-size="11.5" text-anchor="middle">private data stack</text>
    <text x="778" y="230" fill="#645F56" font-size="11.5" text-anchor="middle">private task loop</text>
    <text x="778" y="252" fill="#141413" font-size="11.5" text-anchor="middle">runtime_threads.h</text>
    <text x="778" y="270" fill="#394DF2" font-size="11" text-anchor="middle">zero data races</text>

    <path d="M582 282V312M778 282V312" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
    <polyline points="578,306 582,312 586,306" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="774,306 778,312 782,306" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="494" y="314" width="372" height="86" rx="6" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.25"/>
    <text x="680" y="340" fill="#141413" font-size="13.5" text-anchor="middle" font-weight="700">Typed Channels / Bounded Queues</text>
    <text x="680" y="361" fill="#645F56" font-size="12" text-anchor="middle">send owns-transfer · backpressure</text>
    <text x="680" y="381" fill="#394DF2" font-size="11.5" text-anchor="middle">cross-thread values are moved, never aliased</text>

    <!-- Footer invariant bar -->
    <rect x="36" y="438" width="848" height="38" rx="8" fill="#394DF2"/>
    <text x="460" y="462" fill="#FDFCF9" font-size="13.5" text-anchor="middle" font-weight="700">No shared mutable memory across threads; child tasks never outlive their lexical scope.</text>
  </g>
</svg>

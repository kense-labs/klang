    <text x="54" y="51" fill="#FDFCF9" font-size="20" text-anchor="start" font-weight="700">WEBASSEMBLY TARGET</text>
    <text x="36" y="92" fill="#645F56" font-size="15" text-anchor="start">A K executable for WASI Preview 1</text>
    <g>
    <rect x="36" y="114" width="848" height="58" rx="8" fill="#FDFCF9" stroke="#D4CDC0" stroke-width="1.15"/>
    <text x="460.0" y="137.0" fill="#141413" font-size="16" text-anchor="middle" font-weight="700">k build --target wasm32-wasip1 hello.k</text>
    <text x="460.0" y="159.0" fill="#645F56" font-size="14" text-anchor="middle">.build c_sources · WASI SDK via WASI_SDK_PATH or --cc</text>
    </g>

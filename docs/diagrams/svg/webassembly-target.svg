<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="568" viewBox="0 0 920 568" role="img" aria-labelledby="title description">
  <title id="title">K · WebAssembly target</title>
  <desc id="description">K selects a 32-bit layout and emits C with checked data-stack growth. Package sidecar C sources compile with the same WASI SDK Clang. Target- and toolchain-separated objects link into a WebAssembly command with an _start entry. A WASI Preview 1 host supplies arguments, streams, clocks, and preopened directories.</desc>
  <rect width="920" height="568" rx="14" fill="#F8F6F0"/>
  <g font-family="Menlo, SFMono-Regular, Consolas, monospace">

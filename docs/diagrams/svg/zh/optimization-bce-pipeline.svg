<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title description">
  <title id="title">K · 编译优化与边界检查消除（BCE）</title>
  <desc id="description">编译期范围证明、checkfree 函数契约校验与 -O3 --lto --cpu=native 原生代码生成流程。</desc>
  <rect width="920" height="500" rx="14" fill="#F8F6F0"/>
  <g font-family='"PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", Menlo, monospace'>
    <rect x="36" y="24" width="848" height="42" rx="8" fill="#141413"/>
    <text x="54" y="51" fill="#FDFCF9" font-size="19" text-anchor="start" font-weight="700">编译优化与边界检查消除 · BCE &amp; OPTIMIZER</text>
    <text x="36" y="92" fill="#645F56" font-size="14" text-anchor="start">通过控制流与索引类型静态证明访存合法性，配合 -O3 --lto --cpu=native 生成无分支内循环。</text>

    <!-- Top Row: 4-Stage Optimizer & BCE Pipeline -->
    <rect x="36" y="114" width="192" height="90" rx="8" fill="#141413"/>
    <text x="132" y="140" fill="#FDFCF9" font-size="13.5" text-anchor="middle" font-weight="700">1. 已检查 FnSpec</text>
    <text x="132" y="162" fill="#B5B0A6" font-size="11.5" text-anchor="middle">类型与生命周期事实</text>
    <text x="132" y="182" fill="#B5B0A6" font-size="11.5" text-anchor="middle">u32 in / upto 契约</text>

    <path d="M228 159H252" fill="none" stroke="#141413" stroke-width="1.6" stroke-linecap="round"/>
    <polyline points="245,155 252,159 245,163" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="254" y="114" width="192" height="90" rx="8" fill="#FDFCF9" stroke="#D4CDC0" stroke-width="1.15"/>
    <text x="350" y="140" fill="#141413" font-size="13.5" text-anchor="middle" font-weight="700">2. IR 优化器</text>
    <text x="350" y="162" fill="#645F56" font-size="11.5" text-anchor="middle">optimize*.h</text>
    <text x="350" y="182" fill="#645F56" font-size="11.5" text-anchor="middle">函数内联 · 循环不变量外提</text>

    <path d="M446 159H470" fill="none" stroke="#141413" stroke-width="1.6" stroke-linecap="round"/>
    <polyline points="463,155 470,159 463,163" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="472" y="114" width="192" height="90" rx="8" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.35"/>
    <text x="568" y="140" fill="#141413" font-size="13.5" text-anchor="middle" font-weight="700">3. BCE 证明器</text>
    <text x="568" y="162" fill="#394DF2" font-size="11.5" text-anchor="middle">bce.h · 值域归纳</text>
    <text x="568" y="182" fill="#645F56" font-size="11.5" text-anchor="middle">CFG 控制流 + 别名证明</text>

    <path d="M664 159H688" fill="none" stroke="#141413" stroke-width="1.6" stroke-linecap="round"/>
    <polyline points="681,155 688,159 681,163" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="690" y="114" width="194" height="90" rx="8" fill="#FDFCF9" stroke="#D4CDC0" stroke-width="1.15"/>
    <text x="787" y="140" fill="#141413" font-size="13.5" text-anchor="middle" font-weight="700">4. checkfree 门禁</text>
    <text x="787" y="162" fill="#645F56" font-size="11.5" text-anchor="middle">checkfree fn 声明</text>
    <text x="787" y="182" fill="#645F56" font-size="11.5" text-anchor="middle">残留检查即编译报错</text>

    <!-- Branching arrow down from BCE Solver -->
    <path d="M568 204V228H248V248" fill="none" stroke="#394DF2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="244,241 248,248 252,241" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M568 228H672V248" fill="none" stroke="#141413" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="668,241 672,248 676,241" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Split Box: Proven Safe -->
    <rect x="36" y="250" width="414" height="96" rx="8" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.35"/>
    <text x="54" y="276" fill="#394DF2" font-size="13.5" text-anchor="start" font-weight="700">静态证明安全 -&gt; 彻底消除边界检查</text>
    <text x="54" y="298" fill="#141413" font-size="12" text-anchor="start">• 切片循环上界与归纳变量约束成立</text>
    <text x="54" y="317" fill="#141413" font-size="12" text-anchor="start">• 类型化索引：u32 in dist / u32 upto out</text>
    <text x="54" y="336" fill="#645F56" font-size="11.5" text-anchor="start">-&gt; 直接生成无分支 C 指针 / 下标访问，利于 SIMD</text>

    <!-- Right Split Box: Unproven Fallback -->
    <rect x="470" y="250" width="414" height="96" rx="8" fill="#FDFCF9" stroke="#D4CDC0" stroke-width="1.15"/>
    <text x="488" y="276" fill="#141413" font-size="13.5" text-anchor="start" font-weight="700">证明不足路径 -&gt; 保留安全运行期保护</text>
    <text x="488" y="298" fill="#645F56" font-size="12" text-anchor="start">• 未经静态边界校验的动态索引</text>
    <text x="488" y="317" fill="#645F56" font-size="12" text-anchor="start">• 在 checkfree fn 中会直接拒绝编译通过</text>
    <text x="488" y="336" fill="#141413" font-size="11.5" text-anchor="start">-&gt; 自动插入越界陷阱守卫，守住内存安全底线</text>

    <!-- Converging arrow to Backend -->
    <path d="M248 346V364H460V372" fill="none" stroke="#141413" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M672 346V364H460" fill="none" stroke="#141413" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="456,366 460,373 464,366" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom Output Bar -->
    <rect x="36" y="374" width="848" height="48" rx="8" fill="#141413"/>
    <text x="460" y="403" fill="#FDFCF9" font-size="14" text-anchor="middle" font-weight="700">C 代码生成器 (codegen*.h) -&gt; Clang / GCC / MSVC (-O3 --lto --cpu=native)</text>

    <!-- Footer Invariant -->
    <rect x="36" y="438" width="848" height="38" rx="8" fill="#394DF2"/>
    <text x="460" y="462" fill="#FDFCF9" font-size="13.5" text-anchor="middle" font-weight="700">用一次编译期证明换取 C 级极速内循环，并保持 100% 越界内存安全。</text>
  </g>
</svg>

    <text x="750.0" y="269.0" fill="#645F56" font-size="14.5" text-anchor="middle">按目标隔离的目标文件</text>
    <text x="750.0" y="291.0" fill="#645F56" font-size="14.5" text-anchor="middle">WASI 命令 ABI</text>
    </g>

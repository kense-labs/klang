<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="568" viewBox="0 0 920 568" role="img" aria-labelledby="title description">
  <title id="title">K · WebAssembly 目标</title>
  <desc id="description">K 选用 32 位布局并生成带受检数据栈增长的 C 代码；包随附 C 源码使用同一套 WASI SDK Clang 编译；按目标与工具链隔离的目标文件链接为带 _start 入口的 WebAssembly 命令；由 WASI Preview 1 宿主提供参数、流、时钟与预打开目录。</desc>
  <rect width="920" height="568" rx="14" fill="#F8F6F0"/>
  <g font-family='"PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", Menlo, monospace'>
    <rect x="36" y="24" width="848" height="42" rx="8" fill="#141413" stroke="none" stroke-width="1.15"/>
    <text x="54" y="51" fill="#FDFCF9" font-size="20" text-anchor="start" font-weight="700">WEBASSEMBLY 目标</text>
    <text x="36" y="92" fill="#645F56" font-size="15" text-anchor="start">面向 WASI Preview 1 的 K 可执行文件</text>
    <g>
    <rect x="36" y="114" width="848" height="58" rx="8" fill="#FDFCF9" stroke="#D4CDC0" stroke-width="1.15"/>
    <text x="460.0" y="137.0" fill="#141413" font-size="16" text-anchor="middle" font-weight="700">k build --target wasm32-wasip1 hello.k</text>
    <text x="460.0" y="159.0" fill="#645F56" font-size="14" text-anchor="middle">.build c_sources · 通过 WASI_SDK_PATH 或 --cc 指定 WASI SDK</text>
    </g>

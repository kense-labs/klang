    <text x="170.0" y="269.0" fill="#FDFCF9" font-size="14.5" text-anchor="middle">类型 · 生命周期</text>
    <text x="170.0" y="291.0" fill="#FDFCF9" font-size="14.5" text-anchor="middle">32 位目标布局</text>
    </g>
    <g>
    <rect x="326" y="220" width="268" height="88" rx="8" fill="#FDFCF9" stroke="#D4CDC0" stroke-width="1.15"/>
    <text x="460.0" y="247.0" fill="#141413" font-size="16" text-anchor="middle" font-weight="700">C 后端</text>
    <text x="460.0" y="269.0" fill="#645F56" font-size="14.5" text-anchor="middle">生成 C + 包随附 C</text>
    <text x="460.0" y="291.0" fill="#645F56" font-size="14.5" text-anchor="middle">受检栈增长</text>
    </g>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title description">
  <title id="title">K · 结构化异步与隔离工作线程</title>
  <desc id="description">词法任务作用域管理协作式 async fn，原生工作线程通过类型化队列通信且无共享可变状态。</desc>
  <rect width="920" height="500" rx="14" fill="#F8F6F0"/>
  <g font-family='"PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", Menlo, monospace'>
    <rect x="36" y="24" width="848" height="42" rx="8" fill="#141413"/>
    <text x="54" y="51" fill="#FDFCF9" font-size="19" text-anchor="start" font-weight="700">结构化异步与隔离工作线程 · CONCURRENCY</text>
    <text x="36" y="92" fill="#645F56" font-size="14" text-anchor="start">单线程协作式异步受词法作用域约束；多核并行依赖相互隔离的工作线程与类型化消息队列。</text>

    <!-- Left Panel: Cooperative Async -->
    <rect x="36" y="114" width="408" height="304" rx="8" fill="#FDFCF9" stroke="#D4CDC0" stroke-width="1.15"/>
    <rect x="36" y="114" width="408" height="38" rx="8" fill="#141413"/>
    <rect x="36" y="140" width="408" height="12" fill="#141413"/>
    <text x="56" y="139" fill="#FDFCF9" font-size="13.5" text-anchor="start" font-weight="700">协作式异步任务（原生 &amp; WASI 均支持）</text>

    <rect x="54" y="168" width="372" height="52" rx="6" fill="#F8F6F0" stroke="#D4CDC0" stroke-width="1.1"/>
    <text x="240" y="190" fill="#141413" font-size="13" text-anchor="middle" font-weight="700">词法任务作用域（父帧）</text>
    <text x="240" y="209" fill="#645F56" font-size="11.5" text-anchor="middle">等待子任务完成 · 退出时确定性取消与清理</text>

    <path d="M240 220V236M145 236H335M145 236V250M335 236V250" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="141,244 145,250 149,244" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="331,244 335,250 339,244" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="54" y="252" width="178" height="68" rx="6" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.25"/>
    <text x="143" y="276" fill="#141413" font-size="12.5" text-anchor="middle" font-weight="700">async fn 子任务 A</text>
    <text x="143" y="295" fill="#645F56" font-size="11" text-anchor="middle">编译生成状态机帧</text>
    <text x="143" y="311" fill="#394DF2" font-size="11" text-anchor="middle">await 点挂起</text>

    <rect x="248" y="252" width="178" height="68" rx="6" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.25"/>
    <text x="337" y="276" fill="#141413" font-size="12.5" text-anchor="middle" font-weight="700">async fn 子任务 B</text>
    <text x="337" y="295" fill="#645F56" font-size="11" text-anchor="middle">独立任务帧</text>
    <text x="337" y="311" fill="#394DF2" font-size="11" text-anchor="middle">取消信号级联传播</text>

    <rect x="54" y="336" width="372" height="64" rx="6" fill="#141413"/>
    <text x="240" y="361" fill="#FDFCF9" font-size="13" text-anchor="middle" font-weight="700">调度器 / 反应器 (runtime_tasks.h)</text>
    <text x="240" y="382" fill="#B5B0A6" font-size="11.5" text-anchor="middle">轮询 (poll) · 唤醒 · 按逆序排空子任务</text>

    <!-- Center Bridge: Typed Queue -->
    <path d="M444 266H474" fill="none" stroke="#394DF2" stroke-width="1.8" stroke-dasharray="4 3" stroke-linecap="round"/>
    <polyline points="467,262 474,266 467,270" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M474 294H444" fill="none" stroke="#394DF2" stroke-width="1.8" stroke-dasharray="4 3" stroke-linecap="round"/>
    <polyline points="451,290 444,294 451,298" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Panel: Native Worker Threads -->
    <rect x="476" y="114" width="408" height="304" rx="8" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.25"/>
    <rect x="476" y="114" width="408" height="38" rx="8" fill="#394DF2"/>
    <rect x="476" y="140" width="408" height="12" fill="#394DF2"/>
    <text x="496" y="139" fill="#FDFCF9" font-size="13.5" text-anchor="start" font-weight="700">隔离原生工作线程（零共享可变状态）</text>

    <rect x="494" y="168" width="176" height="114" rx="6" fill="#F8F6F0" stroke="#D4CDC0" stroke-width="1.1"/>
    <text x="582" y="191" fill="#141413" font-size="13" text-anchor="middle" font-weight="700">工作线程 1</text>
    <text x="582" y="212" fill="#645F56" font-size="11.5" text-anchor="middle">私有数据栈</text>
    <text x="582" y="230" fill="#645F56" font-size="11.5" text-anchor="middle">私有任务事件循环</text>
    <text x="582" y="252" fill="#141413" font-size="11" text-anchor="middle">runtime_threads.h</text>
    <text x="582" y="270" fill="#394DF2" font-size="11" text-anchor="middle">不共享可变引用</text>

    <rect x="690" y="168" width="176" height="114" rx="6" fill="#F8F6F0" stroke="#D4CDC0" stroke-width="1.1"/>
    <text x="778" y="191" fill="#141413" font-size="13" text-anchor="middle" font-weight="700">工作线程 N</text>
    <text x="778" y="212" fill="#645F56" font-size="11.5" text-anchor="middle">私有数据栈</text>
    <text x="778" y="230" fill="#645F56" font-size="11.5" text-anchor="middle">私有任务事件循环</text>
    <text x="778" y="252" fill="#141413" font-size="11" text-anchor="middle">runtime_threads.h</text>
    <text x="778" y="270" fill="#394DF2" font-size="11" text-anchor="middle">无数据竞争</text>

    <path d="M582 282V312M778 282V312" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
    <polyline points="578,306 582,312 586,306" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="774,306 778,312 782,306" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="494" y="314" width="372" height="86" rx="6" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.25"/>
    <text x="680" y="340" fill="#141413" font-size="13" text-anchor="middle" font-weight="700">类型化通道 / 有界队列</text>
    <text x="680" y="361" fill="#645F56" font-size="11.5" text-anchor="middle">按值所有权转移 · 支持背压与关闭通知</text>
    <text x="680" y="381" fill="#394DF2" font-size="11" text-anchor="middle">跨线程仅移动所有权，杜绝别名竞态</text>

    <!-- Footer invariant bar -->
    <rect x="36" y="438" width="848" height="38" rx="8" fill="#394DF2"/>
    <text x="460" y="462" fill="#FDFCF9" font-size="13.5" text-anchor="middle" font-weight="700">跨线程零共享可变内存；任何异步子任务都不会逃逸出其词法作用域。</text>
  </g>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" role="img" aria-labelledby="title description">
  <title id="title">K · 数据栈与值生命周期</title>
  <desc id="description">地址稳定的可增长数据栈、受检查的引用根以及作用域退出时的 O(1) 回退释放机制。</desc>
  <rect width="920" height="500" rx="14" fill="#F8F6F0"/>
  <g font-family='"PingFang SC", "Noto Sans SC", "Hiragino Sans GB", "Microsoft YaHei", Menlo, monospace'>
    <rect x="36" y="24" width="848" height="42" rx="8" fill="#141413"/>
    <text x="54" y="51" fill="#FDFCF9" font-size="19" text-anchor="start" font-weight="700">数据栈与值生命周期 · DATA STACKS</text>
    <text x="36" y="92" fill="#645F56" font-size="14" text-anchor="start">地址稳定的分段可增长存储、编译期引用深度校验与作用域退出 O(1) 指针回退。</text>

    <!-- Top context bar -->
    <rect x="36" y="112" width="848" height="48" rx="8" fill="#FDFCF9" stroke="#D4CDC0" stroke-width="1.15"/>
    <text x="460" y="141" fill="#141413" font-size="14" text-anchor="middle" font-weight="700">词法作用域流程：进入栈帧 -&gt; 数据栈顺序分配 -&gt; 函数返回时一键回退</text>

    <!-- Left column: Call Stack Frames -->
    <rect x="36" y="182" width="256" height="236" rx="8" fill="#FDFCF9" stroke="#D4CDC0" stroke-width="1.15"/>
    <rect x="36" y="182" width="256" height="36" rx="8" fill="#141413"/>
    <rect x="36" y="206" width="256" height="12" fill="#141413"/>
    <text x="164" y="205" fill="#FDFCF9" font-size="14" text-anchor="middle" font-weight="700">调用栈帧（Call Stack）</text>

    <rect x="52" y="232" width="224" height="54" rx="6" fill="#F8F6F0" stroke="#D4CDC0" stroke-width="1.1"/>
    <text x="164" y="254" fill="#141413" font-size="13" text-anchor="middle" font-weight="700">fn main() 栈帧</text>
    <text x="164" y="274" fill="#645F56" font-size="11.5" text-anchor="middle">buf: String（水位 = 0x00）</text>

    <path d="M164 286V304" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round"/>
    <polyline points="160,298 164,304 168,298" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="52" y="306" width="224" height="58" rx="6" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.25"/>
    <text x="164" y="328" fill="#141413" font-size="13" text-anchor="middle" font-weight="700">fn parse(&amp;buf) 栈帧</text>
    <text x="164" y="348" fill="#394DF2" font-size="11.5" text-anchor="middle">受检引用 · 水位 = 0x40</text>

    <text x="164" y="395" fill="#645F56" font-size="11.5" text-anchor="middle">类型检查器验证引用根深度</text>

    <!-- Arrows Left -> Center -->
    <path d="M292 259H324" fill="none" stroke="#141413" stroke-width="1.6" stroke-linecap="round"/>
    <polyline points="317,255 324,259 317,263" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M292 335H324" fill="none" stroke="#394DF2" stroke-width="1.6" stroke-dasharray="4 4" stroke-linecap="round"/>
    <polyline points="317,331 324,335 317,339" fill="none" stroke="#394DF2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Center column: Address-Stable Data Stack -->
    <rect x="326" y="182" width="290" height="236" rx="8" fill="#141413"/>
    <text x="471" y="207" fill="#FDFCF9" font-size="14" text-anchor="middle" font-weight="700">地址稳定数据栈（Data Stack）</text>
    <text x="471" y="225" fill="#B5B0A6" font-size="11" text-anchor="middle">连续分段扩展 · 存活期内永不重定位</text>

    <rect x="342" y="240" width="258" height="46" rx="6" fill="#FDFCF9"/>
    <text x="354" y="259" fill="#141413" font-size="12" text-anchor="start" font-weight="700">[0x00] String 字符存储</text>
    <text x="354" y="276" fill="#645F56" font-size="11" text-anchor="start">基址固定 · 所有权归属 main</text>

    <rect x="342" y="294" width="258" height="50" rx="6" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.4"/>
    <text x="354" y="314" fill="#141413" font-size="12" text-anchor="start" font-weight="700">[0x40] Array / 变长 enum 载荷</text>
    <text x="354" y="332" fill="#394DF2" font-size="11" text-anchor="start">按载荷内联布局 · 零堆头开销</text>

    <rect x="342" y="354" width="258" height="46" rx="6" fill="#232321" stroke="#645F56" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="471" y="374" fill="#FDFCF9" font-size="11.5" text-anchor="middle">空闲游标（指针碰撞分配）</text>
    <text x="471" y="390" fill="#B5B0A6" font-size="10.5" text-anchor="middle">当前段满时无缝链接下一段</text>

    <!-- Arrow Center -> Right -->
    <path d="M616 300H648" fill="none" stroke="#141413" stroke-width="1.6" stroke-linecap="round"/>
    <polyline points="641,296 648,300 641,304" fill="none" stroke="#141413" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right column: Scope Exit Rewind -->
    <rect x="650" y="182" width="234" height="236" rx="8" fill="#FDFCF9" stroke="#394DF2" stroke-width="1.25"/>
    <rect x="650" y="182" width="234" height="36" rx="8" fill="#394DF2"/>
    <rect x="650" y="206" width="234" height="12" fill="#394DF2"/>
    <text x="767" y="205" fill="#FDFCF9" font-size="14" text-anchor="middle" font-weight="700">作用域退出回退</text>

    <rect x="666" y="232" width="202" height="52" rx="6" fill="#F8F6F0" stroke="#D4CDC0" stroke-width="1.1"/>
    <text x="767" y="253" fill="#141413" font-size="12.5" text-anchor="middle" font-weight="700">O(1) 游标重置</text>
    <text x="767" y="272" fill="#645F56" font-size="11" text-anchor="middle">直接恢复水位 = 0x40</text>

    <rect x="666" y="294" width="202" height="52" rx="6" fill="#F8F6F0" stroke="#D4CDC0" stroke-width="1.1"/>
    <text x="767" y="315" fill="#141413" font-size="12.5" text-anchor="middle" font-weight="700">零 GC · 零逐对象释放</text>
    <text x="767" y="334" fill="#645F56" font-size="11" text-anchor="middle">无追踪停顿与 free() 碎片</text>

    <rect x="666" y="356" width="202" height="44" rx="6" fill="#F8F6F0" stroke="#D4CDC0" stroke-width="1.1"/>
    <text x="767" y="375" fill="#141413" font-size="12" text-anchor="middle" font-weight="700">返回值直写上层槽位</text>
    <text x="767" y="391" fill="#645F56" font-size="10.5" text-anchor="middle">return ... from 零拷贝交付</text>

    <!-- Footer invariant bar -->
    <rect x="36" y="438" width="848" height="38" rx="8" fill="#394DF2"/>
    <text x="460" y="462" fill="#FDFCF9" font-size="13.5" text-anchor="middle" font-weight="700">核心不变量：值在生命周期内地址恒定，编译期静态保证引用永不悬垂。</text>
  </g>
</svg>
